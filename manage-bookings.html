<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Bookings — Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav"></div>
<main class="container">
  <h2>Manage Bookings</h2>
  <table id="bookTable">
    <thead><tr><th>Room</th><th>Guest</th><th>Move-in</th><th>Note</th><th>Status</th><th></th></tr></thead>
    <tbody id="bookBody"></tbody>
  </table>
</main>
<footer><div class="container">The Register — Admin</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>


<script>
renderNav('admin');

const session = requireAdmin();

async function render() {
  const body = document.getElementById('bookBody');

  const { data: bookings, error } = await supabaseClient
    .from('bookings')
    .select('*')
    .order('created_at', { ascending: false });

  if (error) {
    console.error(error);
    body.innerHTML =
      `<tr><td colspan="6" class="empty">
        Could not load bookings: ${esc(error.message)}
      </td></tr>`;
    return;
  }

  if (!bookings || bookings.length === 0) {
    body.innerHTML =
      '<tr><td colspan="6" class="empty">No booking requests yet.</td></tr>';
    return;
  }

  body.innerHTML = bookings.map(b => `
    <tr>
      <td>${esc(b.room_name)}</td>

      <td>
        ${esc(b.user_name)}
        <br>
        <span class="muted" style="font-size:.78rem;">
          ${esc(b.user_email)}
        </span>
      </td>

      <td>${esc(b.dates)}</td>

      <td>${esc(b.note || '—')}</td>

      <td>
        <select onchange="setStatus('${b.id}', this.value)">
          <option value="pending" ${b.status === 'pending' ? 'selected' : ''}>
            Pending
          </option>
          <option value="confirmed" ${b.status === 'confirmed' ? 'selected' : ''}>
            Confirmed
          </option>
          <option value="cancelled" ${b.status === 'cancelled' ? 'selected' : ''}>
            Cancelled
          </option>
        </select>
      </td>

      <td>
        <button class="btn small danger"
          onclick="removeBooking('${b.id}')">
          Delete
        </button>
      </td>
    </tr>
  `).join('');
}

async function setStatus(id, status) {
  const { error } = await supabaseClient
    .from('bookings')
    .update({ status: status })
    .eq('id', id);

  if (error) {
    alert('Could not update booking: ' + error.message);
    return;
  }

  render();
}

async function removeBooking(id) {
  if (!confirm('Delete this booking request?')) return;

  const { error } = await supabaseClient
    .from('bookings')
    .delete()
    .eq('id', id);

  if (error) {
    alert('Could not delete booking: ' + error.message);
    return;
  }

  render();
}

if (session) render();
</script>
</body>
</html>
