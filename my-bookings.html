<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookings — The Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav"></div>
<main class="container">
  <h2>My Bookings</h2>
  <div id="list"></div>
</main>
<footer><div class="container">The Register — Room Rent Booking · <a href="admin.html">Admin</a></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
renderNav('mybookings');

const session = requireUser();

async function loadBookings() {
  if (!session) return;

  const { data: mine, error } = await supabaseClient
    .from('bookings')
    .select('*')
    .eq('user_email', session.email)
    .order('created_at', { ascending: false });

  const list = document.getElementById('list');

  if (error) {
    console.error(error);
    list.innerHTML =
      `<p class="empty">Could not load bookings: ${esc(error.message)}</p>`;
    return;
  }

  if (!mine || mine.length === 0) {
    list.innerHTML =
      '<p class="empty">No bookings yet. <a href="rooms.html">Browse rooms</a></p>';
    return;
  }

  list.innerHTML = `
    <table>
      <thead>
        <tr>
          <th>Room</th>
          <th>Move-in</th>
          <th>Note</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        ${mine.map(b => `
          <tr>
            <td>${esc(b.room_name)}</td>
            <td>${esc(b.dates)}</td>
            <td>${esc(b.note || '—')}</td>
            <td>
              <span class="badge ${esc(b.status)}">
                ${esc(b.status)}
              </span>
            </td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
}

loadBookings();

</script>
</body>
</html>
