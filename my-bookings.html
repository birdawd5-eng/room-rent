<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Bookings — The Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav"></div>
<main class="container">
  <h2>My Bookings</h2>
  <div id="list"></div>
</main>
<footer><div class="container">The Register — Room Rent Booking · <a href="admin.html">Admin</a></div></footer>

<script src="app.js"></script>
<script>
renderNav('mybookings');
const session = requireUser();
if(session){
  const mine = getBookings().filter(b=>b.userEmail===session.email).sort((a,b)=>b.createdAt.localeCompare(a.createdAt));
  const list = document.getElementById('list');
  if(mine.length===0){
    list.innerHTML = '<p class="empty">No bookings yet. <a href="rooms.html">Browse rooms</a></p>';
  } else {
    list.innerHTML = `<table><thead><tr><th>Room</th><th>Move-in</th><th>Note</th><th>Status</th></tr></thead><tbody>
      ${mine.map(b=>`<tr>
        <td>${esc(b.roomName)}</td>
        <td>${esc(b.dates)}</td>
        <td>${esc(b.note||'—')}</td>
        <td><span class="badge ${b.status}">${esc(b.status)}</span></td>
      </tr>`).join('')}
    </tbody></table>`;
  }
}
</script>
</body>
</html>
