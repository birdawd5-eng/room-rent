<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Manage Rooms — Admin</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav"></div>
<main class="container">
  <h2>Manage Rooms</h2>
  <table id="roomTable">
    <thead><tr><th>No.</th><th>Name</th><th>Rent/month</th><th>Capacity</th><th>Description</th><th>Available</th><th></th></tr></thead>
    <tbody id="roomBody"></tbody>
  </table>

  <h3 style="margin-top:2rem;">Add a room</h3>
 <form class="box" onsubmit="return addRoom(event)">
    <label for="nNum">Room number</label>
    <input id="nNum" required>
    <label for="nName">Name</label>
    <input id="nName" required>
    <label for="nPrice">Rent / month (₹)</label>
    <input id="nPrice" type="number" min="0" required>
    <label for="nCap">Capacity</label>
    <input id="nCap" placeholder="e.g. 2 guests">
    <label for="nDesc">Description</label>
    <textarea id="nDesc" rows="2"></textarea>
    <div style="margin-top:1.2rem;"><button class="btn" type="button" onclick="addRoom(event)">Add room</button></div>
  </form>
</main>
<footer><div class="container">The Register — Admin</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>
<script>
renderNav('admin');
const session = requireAdmin();

async function render(){
  const { data: rooms, error } = await supabaseClient
    .from("rooms")
    .select("*")
    .order("number");

  if(error){
    console.error(error);
    alert("Could not load rooms: " + error.message);
    return;
  }

  const body = document.getElementById("roomBody");

  if(!rooms || rooms.length === 0){
    body.innerHTML =
      '<tr><td colspan="7" class="empty">No rooms yet.</td></tr>';
    return;
  }

  body.innerHTML = rooms.map(r => `
    <tr data-id="${r.id}">
      <td><input class="f-num" value="${esc(r.number)}" style="width:3.5em;"></td>
      <td><input class="f-name" value="${esc(r.name)}"></td>
      <td><input class="f-price" type="number" value="${r.price}" style="width:6em;"></td>
      <td><input class="f-cap" value="${esc(r.capacity)}"></td>
      <td><textarea class="f-desc" rows="2">${esc(r.desc || "")}</textarea></td>
      <td><input class="f-avail" type="checkbox" ${r.available ? "checked" : ""}></td>
      <td>
        <button class="btn small" onclick="saveRoom('${r.id}')">Save</button>
        <button class="btn small danger" onclick="deleteRoom('${r.id}')">Delete</button>
      </td>
    </tr>
  `).join("");
}

async function saveRoom(id){
  const row = document.querySelector(`tr[data-id="${id}"]`);

  const updatedRoom = {
    number: row.querySelector(".f-num").value.trim(),
    name: row.querySelector(".f-name").value.trim(),
    price: Number(row.querySelector(".f-price").value) || 0,
    capacity: row.querySelector(".f-cap").value.trim(),
    desc: row.querySelector(".f-desc").value.trim(),
    available: row.querySelector(".f-avail").checked
  };

  const { error } = await supabaseClient
    .from("rooms")
    .update(updatedRoom)
    .eq("id", id);

  if(error){
    console.error(error);
    alert("Could not save room: " + error.message);
    return;
  }

  alert("Room saved successfully!");
  render();
}

async function deleteRoom(id){
  if(!confirm("Delete this room?")) return;

  const { error } = await supabaseClient
    .from("rooms")
    .delete()
    .eq("id", id);

  if(error){
    console.error(error);
    alert("Could not delete room: " + error.message);
    return;
  }

  render();
}

async function addRoom(e){
  e.preventDefault();

  const number = document.getElementById("nNum").value.trim();
  const name = document.getElementById("nName").value.trim();
  const price = Number(document.getElementById("nPrice").value);
  const capacity = document.getElementById("nCap").value.trim();
  const desc = document.getElementById("nDesc").value.trim();

  if (!number || !name || Number.isNaN(price)) {
    alert("Please fill in Room number, Name and Rent.");
    return;
  }

  const room = {
    number: number,
    name: name,
    price: price,
    capacity: capacity,
    desc: desc,
    available: true
  };

  try {
    const { data, error } = await supabaseClient
      .from("rooms")
      .insert([room])
      .select();

    if (error) {
      console.error("Supabase error:", error);
      alert("Could not add room:\n" + error.message);
      return;
    }

    console.log("Room added:", data);

    alert("Room added successfully!");

    document.getElementById("nNum").value = "";
    document.getElementById("nName").value = "";
    document.getElementById("nPrice").value = "";
    document.getElementById("nCap").value = "";
    document.getElementById("nDesc").value = "";

    await render();

  } catch (err) {
    console.error("Unexpected error:", err);
    alert("Unexpected error:\n" + err.message);
  }
}

if(session) render();
</script>
</body>
</html>
