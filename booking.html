<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Room — The Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav"></div>
<main class="container">
  <h2>Book a Room</h2>
  <div id="msg"></div>
  <div id="roomInfo" class="card" style="max-width:440px;margin-bottom:1.2rem;"></div>

  <form class="box" id="bookForm" onsubmit="return submitBooking(event)">
    <label for="dates">Preferred move-in</label>
    <input type="date" id="dates" required>
    <label for="note">Note (optional)</label>
    <textarea id="note" rows="3" placeholder="Anything the admin should know"></textarea>
    <div style="margin-top:1.2rem;"><button class="btn" type="submit">Send booking request</button></div>
  </form>
</main>
<footer><div class="container">The Register — Room Rent Booking · <a href="admin.html">Admin</a></div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="app.js"></script>

<script>

renderNav('rooms');

// Automatically block previous dates
const dateInput = document.getElementById('dates');

const today = new Date();
const year = today.getFullYear();
const month = String(today.getMonth() + 1).padStart(2, '0');
const day = String(today.getDate()).padStart(2, '0');

dateInput.min = `${year}-${month}-${day}`;

const params = new URLSearchParams(window.location.search);
const roomId = params.get('room');


let room = null;

async function loadRoom() {
  const { data, error } = await supabaseClient
    .from('rooms')
    .select('*')
    .eq('id', roomId)
    .single();

  if (error || !data) {
    console.error(error);
    document.getElementById('roomInfo').outerHTML =
      '<p class="empty">Room not found. <a href="rooms.html">Back to rooms</a></p>';
    document.getElementById('bookForm').style.display = 'none';
    return;
  }

  room = data;

  if (!room.available) {
    document.getElementById('roomInfo').innerHTML =
      `<h3>${esc(room.name)}</h3>
       <p class="muted">This room is not currently available for booking.</p>`;
    document.getElementById('bookForm').style.display = 'none';
    return;
  }

  document.getElementById('roomInfo').innerHTML =
    `<h3>${esc(room.name)}</h3>
     <p>₹${room.price} / month · ${esc(room.capacity)}</p>
     <p class="muted">${esc(room.description || '')}</p>`;
}

async function submitBooking(e) {
  e.preventDefault();

  const session = requireUser();
  if (!session || !room) return false;

  const dates = document.getElementById('dates').value.trim();
  const note = document.getElementById('note').value.trim();

  const { error } = await supabaseClient
    .from('bookings')
    .insert({
      id: uid('b'),
      room_id: room.id,
      room_name: room.name,
      user_email: session.email,
      user_name: session.name,
      dates: dates,
      note: note,
      status: 'pending',
      created_at: new Date().toISOString()
    });

  if (error) {
    console.error(error);
    document.getElementById('msg').innerHTML =
      `<div class="msg error">Booking failed: ${esc(error.message)}</div>`;
    return false;
  }

  document.getElementById('msg').innerHTML =
    '<div class="msg success">Request sent. Track its status under My Bookings.</div>';

  document.getElementById('bookForm').style.display = 'none';
  return false;
}

loadRoom();
</script>
</body>
</html>
