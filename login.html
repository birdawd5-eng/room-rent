<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — The Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="nav"></div>
<main class="container">
  <h2>User Login</h2>
  <div class="tabs">
    <button id="tabLogin" class="active" onclick="showTab('login')">Login</button>
    <button id="tabReg" onclick="showTab('register')">Register</button>
  </div>

  <div id="msg"></div>

  <form class="box" id="loginForm" onsubmit="return doLogin(event)">
    <label for="lEmail">Email</label>
    <input id="lEmail" type="email" required>
    <label for="lPass">Password</label>
    <input id="lPass" type="password" required>
    <div style="margin-top:1.2rem;"><button class="btn" type="submit">Log in</button></div>
  </form>

  <form class="box" id="regForm" style="display:none;" onsubmit="return doRegister(event)">
    <label for="rName">Name</label>
    <input id="rName" required>
    <label for="rEmail">Email</label>
    <input id="rEmail" type="email" required>
    <label for="rPass">Password</label>
    <input id="rPass" type="password" required minlength="4">
    <div style="margin-top:1.2rem;"><button class="btn" type="submit">Create account</button></div>
  </form>
</main>
<footer><div class="container">The Register — Room Rent Booking · <a href="admin.html">Admin</a></div></footer>

<script src="app.js"></script>
<script>
renderNav('login');

function showTab(which){
  document.getElementById('loginForm').style.display = which==='login' ? 'block':'none';
  document.getElementById('regForm').style.display = which==='register' ? 'block':'none';
  document.getElementById('tabLogin').classList.toggle('active', which==='login');
  document.getElementById('tabReg').classList.toggle('active', which==='register');
  document.getElementById('msg').innerHTML = '';
}

function showMsg(text, type){
  document.getElementById('msg').innerHTML = `<div class="msg ${type}">${esc(text)}</div>`;
}

function doLogin(e){
  e.preventDefault();
  const email = document.getElementById('lEmail').value.trim().toLowerCase();
  const pass = document.getElementById('lPass').value;
  const user = getUsers().find(u=>u.email===email && u.password===pass);
  if(!user){ showMsg('No account matches that email and password.', 'error'); return false; }
  setSession({role:'user', email:user.email, name:user.name});
  window.location.href = 'rooms.html';
  return false;
}

function doRegister(e){
  e.preventDefault();
  const name = document.getElementById('rName').value.trim();
  const email = document.getElementById('rEmail').value.trim().toLowerCase();
  const pass = document.getElementById('rPass').value;
  const users = getUsers();
  if(users.some(u=>u.email===email)){ showMsg('An account with that email already exists.', 'error'); return false; }
  users.push({name, email, password:pass});
  saveUsers(users);
  setSession({role:'user', email, name});
  window.location.href = 'rooms.html';
  return false;
}
</script>
</body>
</html>
